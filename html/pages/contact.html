<section class="page-section">
  <span class="badge-glow">We are here to help</span>
  <h2 class="section-title">Contact Us</h2>
  <p class="section-subtitle">
    Tell us what you want to build and we will help you find the right starting
    point.
  </p>
  <div class="glass-card form-card">
    <form id="contact-form" class="site-form" method="post">
      <label for="contact-name">Your name</label>
      <input
        id="contact-name"
        name="name"
        type="text"
        autocomplete="name"
        required
      />
      <label for="contact-email">Email address</label>
      <input
        id="contact-email"
        name="email"
        type="email"
        autocomplete="email"
        required
      />
      <label for="contact-message">How can we help?</label>
      <textarea
        id="contact-message"
        name="message"
        rows="6"
        required
      ></textarea>
      <button class="btn btn-gradient-primary" type="submit">
        Send message
      </button>
      <p
        id="contact-status"
        class="form-note"
        role="status"
        aria-live="polite"
      ></p>
    </form>
    <p
      id="contact-auth-required"
      class="form-note contact-auth-required"
      hidden
    >
      Please log in to contact us.
      <a href="#login">Go to Login</a>
    </p>
  </div>
</section>
